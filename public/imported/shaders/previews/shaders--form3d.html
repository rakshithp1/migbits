<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self' 'unsafe-inline';style-src 'unsafe-inline';img-src 'self' data: blob:;connect-src 'none';worker-src 'none';base-uri 'none';form-action 'none'"><meta name="source-license-notices" content="/imported/shaders/previews/LICENSES.txt"><title>Form3D — WebGPU preview</title><style>html,body{margin:0;background:#080b14;color:white;font:13px system-ui}canvas{display:block;width:100%;height:auto;aspect-ratio:640/440}#error{padding:16px;white-space:pre-wrap}button{position:fixed;right:12px;bottom:12px;padding:8px 14px;background:#171c2b;color:white;border:1px solid #68738d;border-radius:8px}button:focus-visible{outline:3px solid #c4b5fd}</style></head><body data-preview-state="loading"><canvas aria-label="Form3D decorative shader"></canvas><div id="error" role="status">Requires a WebGPU-capable browser and GPU.</div><script src="runtime.js"></script><script>
const media=matchMedia('(prefers-reduced-motion:reduce)');let ready=false,busy=false,parentPaused=false,timer;
function schedule(){clearTimeout(timer);if(ready&&!document.hidden&&!media.matches&&!parentPaused)timer=setTimeout(tick,33)}
async function tick(){if(busy||document.hidden||media.matches||parentPaused)return;busy=true;try{await window.advanceShader();document.body.dataset.motionState=media.matches||document.hidden||parentPaused?'paused':'running'}catch(e){ready=false;document.body.dataset.previewState='error';document.getElementById('error').textContent='Live preview unavailable: '+e.message}finally{busy=false;schedule()}}
runShader("Form3D",{}).then(()=>{ready=true;document.getElementById('error').textContent='';schedule()}).catch(e=>{document.getElementById('error').textContent='Live WebGPU preview unavailable on this device. '+e.message});
function policy(){document.body.dataset.motionState=media.matches||document.hidden||parentPaused?'paused':'running';schedule()}
addEventListener('message',event=>{if(event.source===parent&&event.data?.type==='migbits-motion-policy'&&typeof event.data.paused==='boolean'){parentPaused=event.data.paused;policy()}});media.addEventListener('change',policy);document.addEventListener('visibilitychange',policy);policy();
</script></body></html>
