/* ============================================================
   Inspo - Editorial Design Tokens
   Vibe: archive / magazine / colophon (A24, MUBI, Are.na)

@theme {
  /* Type families */
  --font-display: var(--font-fraunces), ui-serif, Georgia, serif;
  --font-sans: var(--font-inter-tight), ui-sans-serif, system-ui, sans-serif;
  /* Mono retired. The site runs on two families now: display (Fraunces)
     and sans (Inter Tight). This token is kept but repointed at the sans
     stack so the many existing `font-mono` / `.text-meta` call sites
     collapse to Inter Tight without a 40-file rename. New code should use
     --font-sans directly; `font-mono` is effectively an alias. */
  --font-mono: var(--font-inter-tight), ui-sans-serif, system-ui, sans-serif;

  /* Editorial palette (light) */
  --color-paper: #f4f1ec;
  --color-ink: #1a1a1a;
  --color-ink-muted: #6b6862;
  --color-rule: #d8d3c8;
  /* A hair darker than the original #c7402f so accent text on paper
     clears AA (4.81:1, was 4.44:1). Indistinguishable by eye. */
  --color-accent-light: #bf3b2b;

  /* Editorial palette (dark) */
  --color-paper-dark: #0e0e0c;
  --color-ink-dark: #e8e4dd;
  --color-ink-dark-muted: #918d85;
  --color-rule-dark: #2a2825;
  --color-accent-dark: #e36b58;

  /* Active surface tokens - flipped by .dark.
     --color-accent is one of the three names an external design linter
     keys on by name (with --color-accent-ink and --font-label);
     everything else it reads off computed CSS. So the ACTIVE accent
     carries that name and the per-mode literals are the ones that got
     suffixed, rather than the other way round. --color-link stays as an
     alias because ~40 call sites use it. */
  --color-bg: var(--color-paper);
  --color-fg: var(--color-ink);
  --color-fg-muted: var(--color-ink-muted);
  --color-border: var(--color-rule);
  --color-accent: var(--color-accent-light);
  /* Text sitting ON the accent, never beside it. Its own value rather
     than an alias of paper, a hair lighter than paper so it clears AA
     against the accent by a wider margin while staying off pure white. */
  --color-accent-ink: #fdfdfb;
  --color-link: var(--color-accent);

  /* Type scale */
  --text-display: clamp(3.5rem, 9vw, 8.5rem);
  --text-display-line-height: 0.9;
  --text-display-letter-spacing: -0.04em;

  --text-h1: clamp(2.25rem, 5vw, 4rem);
  --text-h1-line-height: 1;
  --text-h1-letter-spacing: -0.025em;

  --text-h2: clamp(1.5rem, 2.5vw, 2.25rem);
  --text-h2-line-height: 1.1;
  --text-h2-letter-spacing: -0.015em;

  --text-body: 1.0625rem;
  --text-body-line-height: 1.6;

  --text-meta-letter-spacing: 0.01em;

  /* ── Radius scale ─────────────────────────────────────────
     The 2026-08 softening pass: nothing on the site renders as a
     hard block any more. Three stops only, so the rounding reads
     as one voice:
       tile  - screenshots and thumbnails
       card  - panels, code blocks, popovers
       pill  - every button, chip, input, tab
     (--radius-pill exists for raw CSS; utilities use rounded-full.) */
  --radius-tile: 1rem;
  --radius-card: 1.5rem;
  --radius-pill: 9999px;

  /* ── One scale, seven steps ──────────────────────────────
     The site had twenty distinct font sizes in use against five
     declared tokens, because components reach for Tailwind's default
     scale and for arbitrary values instead of the tokens. Rather than
     rename ~107 files, re-point Tailwind's own size utilities onto the
     scale - the same aliasing trick --font-mono uses above. Every
     existing text-sm / text-2xl / text-5xl now lands on one of these
     seven values:

       0.75    meta      labels, captions, chips
       0.875   small     secondary copy, dense UI
       1.0625  body      default running text
       1.1875  sub       card titles, lead-ins
       1.5     h2-fixed  section headings in cards
       2.25    h1-fixed  page headings
       3.25    hero      display type

     Sizes are deliberately collapsed in pairs (lg/xl, 2xl/3xl,
     4xl/5xl, 6xl/7xl) so reaching for the next class up is a no-op
     rather than a new size. The fluid --text-display / --text-h1 /
     --text-h2 above stay as the semantic headline family and span the
     same values. */
  --text-xs: 0.75rem;
  --text-xs--line-height: 1.45;
  --text-sm: 0.875rem;
  --text-sm--line-height: 1.55;
  --text-base: 1.0625rem;
  --text-base--line-height: 1.6;
  --text-lg: 1.1875rem;
  --text-lg--line-height: 1.45;
  --text-xl: 1.1875rem;
  --text-xl--line-height: 1.45;
  --text-2xl: 1.5rem;
  --text-2xl--line-height: 1.2;
  --text-3xl: 1.5rem;
  --text-3xl--line-height: 1.2;
  --text-4xl: 2.25rem;
  --text-4xl--line-height: 1.1;
  --text-5xl: 2.25rem;
  --text-5xl--line-height: 1.1;
  --text-6xl: 3.25rem;
  --text-6xl--line-height: 1.02;
  --text-7xl: 3.25rem;
  --text-7xl--line-height: 1.02;
}

@variant dark (&:where(.dark, .dark *));

.dark {
  --color-bg: var(--color-paper-dark);
  --color-fg: var(--color-ink-dark);
  --color-fg-muted: var(--color-ink-dark-muted);
  --color-border: var(--color-rule-dark);
  --color-accent: var(--color-accent-dark);
  --color-accent-ink: var(--color-paper-dark);
  --color-link: var(--color-accent);
}

/* Base */
html {
  color-scheme: light dark;
  scroll-behavior: smooth;
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

body {
  background: var(--color-bg);
  color: var(--color-fg);
  font-family: var(--font-sans);
  font-size: var(--text-body);
  line-height: var(--text-body-line-height);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01", "cv11";
}

/* Selection - editorial red highlight */
::selection {
  background: var(--color-link);
  color: var(--color-bg);
}

/* Focus - global ring for links/buttons; inputs handle their own
   focus state. The outline hugs each element's own border-radius
   (modern browsers trace it), so pills get pill-shaped rings. */
:focus-visible {
  outline: 2px solid var(--color-link);
  outline-offset: 3px;
}
input:focus,
input:focus-visible,
textarea:focus,
textarea:focus-visible {
  outline: none;
}

/* Reduced motion respect */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ─── Hover-scroll tile overlay ───────────────────────────
   A tile's parent <article class="group"> drives hover state.
   The overlay holds the full-page screenshot; it sits over the
   hero image at opacity 0 until hover, then fades in and slowly
   scrolls top→bottom via object-position interpolation.

   The duration custom property is set per-tile by the JS component
   so taller pages can scroll for longer if needed. Default 5.5 s.

   prefers-reduced-motion: the global override above kills the
   transition duration → the overlay still fades in (200 ms), but
   the scroll itself runs in ~0 ms (i.e. shows the bottom of the
   page on hover, no motion). That's the right reduced-motion
   behavior: no nausea-inducing scroll, but the user still gets
   visual confirmation the tile responds.
*/
.hover-scroll-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 0%;
  opacity: 0;
  pointer-events: none;
  transition: opacity 220ms ease-out;
}
/* Drive the scroll via an animation rather than a transition. With a
   transition, the <img> mounts already in the parent's :hover state
   (because the user has been hovering since before the img existed),
   so the browser sees no state delta and skips the animation. An
   animation plays from start every time the rule applies, regardless
   of when the element was inserted.

   `.is-ready` is added by the component once the image has decoded.
   Without it the animation starts at mount, runs while the bytes are
   still downloading, and the first painted frame lands wherever the
   clock happens to be - several hundred ms in, past the hero. Gating
   on decode is what makes the first hover match every later one. */
.group:hover .hover-scroll-img.is-ready,
.group:focus-within .hover-scroll-img.is-ready {
  opacity: 1;
  animation: hover-scroll-down var(--hover-scroll-duration, 5500ms)
    cubic-bezier(0.33, 0, 0.4, 1) forwards;
}
@keyframes hover-scroll-down {
  from { object-position: 50% 0%; }
  to { object-position: 50% 100%; }
}

/* Editorial helpers */
.font-display {
  font-family: var(--font-display);
  font-optical-sizing: auto;
  font-variation-settings: "SOFT" 30, "WONK" 0, "opsz" 144;
}

.text-display {
  font-family: var(--font-display);
  font-size: var(--text-display);
  line-height: var(--text-display-line-height);
  letter-spacing: var(--text-display-letter-spacing);
  font-weight: 400;
}

.text-meta {
  font-family: var(--font-mono);
  font-size: var(--text-meta);
  line-height: var(--text-meta-line-height);
  letter-spacing: var(--text-meta-letter-spacing);
  color: var(--color-fg-muted);
}

/* ─── Optical eyebrow / heading alignment ──────────────────
   A small eyebrow label top-aligned in a grid next to a big
   heading used to float above the heading's caps: the grid aligns
   line-box tops, but a heading carries extra half-leading above
   its cap height, and that gap scales with font size - so it read
   fine next to small headings and visibly wrong next to large
   ones. text-box-trim removes the over-cap leading so the label
   and the heading both sit on their true cap line; a plain
   top-aligned grid then lines them up exactly, at every size.
   Baselines are untouched, so baseline-aligned rows (e.g. tile
   title + tag) are unaffected. Progressive enhancement: browsers
   without text-box-trim (currently Firefox) keep the prior
   alignment - nothing breaks. */
h1,
h2,
.text-meta,
.mcp-section-label {
  text-box-trim: trim-start;
  text-box-edge: cap alphabetic;
}

.rule {
  border-color: var(--color-border);
}

/* Code strings breathe. --font-mono is aliased to Inter Tight, which
   reads cramped at its default tracking when set as a command or
   config snippet - open it up slightly everywhere code renders. */
pre,
code {
  letter-spacing: 0.025em;
}

/* ─── Masthead capsule · scroll-linked shrink ──────────────
   Where scroll-driven animations are supported (Chrome/Edge/Safari),
   the capsule narrows continuously over the first 200px of scroll -
   width, wash, and a feather shadow interpolate WITH the scroll
   position, so the motion feels attached to the page rather than
   toggled. The animated properties override the class-based
   fallback below, which stays in place for Firefox (a 500ms
   max-width transition flipped by a JS scroll listener). */
@keyframes masthead-shrink {
  from {
    max-width: 110rem;
    background-color: color-mix(in oklab, var(--color-bg) 70%, transparent);
    box-shadow: 0 4px 18px -8px rgba(0, 0, 0, 0);
  }
  to {
    max-width: 46rem;
    background-color: color-mix(in oklab, var(--color-bg) 88%, transparent);
    box-shadow: 0 4px 18px -8px rgba(0, 0, 0, 0.1);
  }
}
@supports (animation-timeline: scroll()) {
  .masthead-capsule {
    animation: masthead-shrink linear both;
    animation-timeline: scroll(root);
    animation-range: 0 200px;
  }
}
/* Scroll timelines ignore animation-duration, so the global
   reduced-motion override doesn't catch this one - opt out
   explicitly and let the class-based fallback (instant under
   reduced motion) take over. */
@media (prefers-reduced-motion: reduce) {
  .masthead-capsule {
    animation: none;
  }
}

/* ─── Masthead utility cluster · pill segments ─────────────
   The GitHub-star / ⌘K / theme controls live inside one rounded
   enclosure and read as a single filed unit. Each control is a
   .util-seg pill: quiet at rest, lifted with a faint ink wash plus
   accent type on hover. The enclosing capsule never changes, so
   the cluster stays calm.
*/
.util-seg {
  border-radius: var(--radius-pill);
  transition:
    background-color 200ms ease,
    color 200ms ease;
}
.util-seg:hover {
  background-color: color-mix(in oklab, var(--color-fg) 7%, transparent);
  color: var(--color-link);
}
.util-seg:active {
  background-color: color-mix(in oklab, var(--color-fg) 12%, transparent);
}

/* ─── Grid stagger fade-in ──────────────────────────────────
   Tiles fade in from top → down with a 30ms-per-tile cascade,
   capped at 24 (so beyond the fold we don't pile up delays).
   Respect prefers-reduced-motion via the global block above.
*/
@keyframes screens-grid-rise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.screens-grid-item {
  --idx: 0;
  opacity: 0;
  animation: screens-grid-rise 360ms ease-out forwards;
  animation-delay: calc(var(--idx) * 30ms);
}

/* View Transitions on the grid swap. The browser fades old/new states;
   we tune the duration so the change feels deliberate, not snappy. */
::view-transition-old(root),
::view-transition-new(root) {
  animation-duration: 240ms;
  animation-timing-function: ease-out;
}

/* ─── Skeleton shimmer ─────────────────────────────────────
   A faint diagonal sheen sweeps the tile placeholder every 1.6s.
   Calmer than a typical shimmer (no high-contrast white bar) - keeps
   the page from feeling like it's busy doing nothing.
*/
@keyframes screens-skeleton-shimmer-sweep {
  from {
    transform: translateX(-100%);
  }
  to {
    transform: translateX(150%);
  }
}

.screens-skeleton-shimmer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    100deg,
    transparent 0%,
    color-mix(in oklab, var(--color-fg) 5%, transparent) 50%,
    transparent 100%
  );
  animation: screens-skeleton-shimmer-sweep 1.6s ease-in-out infinite;
}

/* ─── Detail page entry ────────────────────────────────────
   /screens/<slug> sections fade-in-up, staggered.
*/
@keyframes screens-detail-fade-in-up {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.screens-detail-section {
  --idx: 0;
  opacity: 0;
  animation: screens-detail-fade-in-up 480ms ease-out forwards;
  animation-delay: calc(var(--idx) * 90ms);
}

/* ─── Top route-progress bar ───────────────────────────────
   2px line that grows to 80% over 600ms while a route is pending,
   completes to 100% on settle, then fades out.
*/
@keyframes screens-route-progress-grow {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(0.8);
  }
}

@keyframes screens-route-progress-finish {
  from {
    transform: scaleX(0.8);
    opacity: 1;
  }
  60% {
    transform: scaleX(1);
    opacity: 1;
  }
  to {
    transform: scaleX(1);
    opacity: 0;
  }
}


/* View Transitions - quick editorial crossfade between routes.
   Only fires in browsers that support the View Transitions API
   (Chrome/Edge stable, Safari TP, Firefox behind flag). Otherwise
   the page swaps instantly as usual. */
::view-transition-old(root) {
  animation: 180ms cubic-bezier(0.2, 0, 0.13, 1.5) both vt-out;
}
::view-transition-new(root) {
  animation: 220ms cubic-bezier(0.2, 0, 0.13, 1.5) 30ms both vt-in;
}
@keyframes vt-out {
  to { opacity: 0; transform: translateY(-2px); }
}
@keyframes vt-in {
  from { opacity: 0; transform: translateY(2px); }
}
@media (prefers-reduced-motion: reduce) {
  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation: none;
  }
}

/* ─── ⌘K palette · group rhythm ────────────────────────────
   cmdk gives us [cmdk-group] wrappers and [cmdk-group-heading]
   labels with no default styling. The defaults read as shouty -
   too much top margin, plain text. Replace with a small lowercase
   mono caption, faint colour, hairline rule to the right so each
   section reads like a magazine sub-deck rather than a label.
*/
[cmdk-group] {
  padding: 0;
}
[cmdk-group]:not(:first-child) {
  margin-top: 6px;
}
[cmdk-group-heading] {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 12px 6px;
  font-family: var(--font-mono);
  font-size: 0.6875rem; /* 11px */
  font-weight: 400;
  letter-spacing: 0.06em;
  text-transform: lowercase;
  color: color-mix(in oklab, var(--color-fg-muted) 75%, transparent);
  pointer-events: none;
  user-select: none;
}
[cmdk-group-heading]::after {
  content: "";
  flex: 1;
  height: 1px;
  background: color-mix(in oklab, var(--color-border) 60%, transparent);
}
[cmdk-group]:first-child > [cmdk-group-heading] {
  padding-top: 6px;
}
/* When the active item is in a group, give the heading a hint of
   accent so the eye knows where it is. Subtle - about a 10% tint. */
[cmdk-group]:has([aria-selected="true"]) > [cmdk-group-heading] {
  color: color-mix(in oklab, var(--color-link) 75%, var(--color-fg-muted));
}

/* ─── MCP page · section labels ───────────────────────────
   The thin labels in the left rail of the MCP page were too quiet -
   the page is the project's elevator pitch and these need to catch
   the eye. Same mono caption typography as .text-meta but with full
   foreground contrast: ink on light, pure white on dark. Slightly
   wider tracking so they read as section markers, not body copy.
*/
.mcp-section-label {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  line-height: 1.4;
  letter-spacing: 0.01em;
  font-weight: 500;
  color: var(--color-fg);
}
:root.dark .mcp-section-label {
  color: #ffffff;
}
