<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none';script-src 'self' 'unsafe-inline';style-src 'unsafe-inline';img-src 'self' data: blob:;connect-src 'none';worker-src 'none';base-uri 'none';form-action 'none'"><meta name="source-license-notices" content="/imported/shaders/previews/LICENSES.txt"><title>VHS — WebGPU preview</title><style>html,body{margin:0;background:#080b14;color:white;font:13px system-ui}canvas{display:block;width:100%;height:auto;aspect-ratio:640/440}#error{padding:16px;white-space:pre-wrap}button{position:fixed;right:12px;bottom:12px;padding:8px 14px;background:#171c2b;color:white;border:1px solid #68738d;border-radius:8px}button:focus-visible{outline:3px solid #c4b5fd}</style></head><body data-preview-state="loading"><canvas aria-label="VHS decorative shader"></canvas><div id="error" role="status">Requires a WebGPU-capable browser and GPU.</div><button id="play" disabled>Play animation</button><script src="runtime.js"></script><script>let running=false;const play=document.getElementById('play');runShader("VHS",{}).then(()=>{document.getElementById('error').textContent='';play.disabled=false}).catch(e=>{document.getElementById('error').textContent='Live WebGPU preview unavailable on this device. The gallery thumbnail shows a verified render. '+e.message});play.onclick=()=>{running=!running;play.textContent=running?'Pause animation':'Play animation';if(running)tick()};async function tick(){if(!running)return;try{await window.advanceShader();setTimeout(tick,33)}catch(e){running=false;play.textContent='Preview unavailable';document.getElementById('error').textContent=e.message}}document.addEventListener('visibilitychange',()=>{if(document.hidden){running=false;play.textContent='Play animation'}});</script></body></html>
