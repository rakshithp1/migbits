  position: absolute;
  background: rgba(0, 0, 0, 0.4);
  border-radius: 10px;
  width: 20px;
  height: 20px;
  top: 10px;
  right: 10px;
  display: flex;
  justify-content: center;

  cursor: pointer;

  margin-top: 100px;
  margin-bottom: 200px;
  padding: 20px;

  width: 100%;
  margin-bottom: 50px;

  height: 50px;
  margin-right: 12px;

  background: white;
  border-radius: 10px;

  border-radius: 10px;

  margin-bottom: 40px;
}

  top: 20px;
  left: 20px;
  width: 120px;
  height: 120px;
}

  .content-placeholder {
    padding-left: 80px;
  }

  .progress-icon {
    width: 70px;
    height: 70px;
    left: 10px;
    top: 10px;
  }

  .header .word {
    height: 30px;
  }

  .word {
    height: 14px;
    margin-bottom: 5px;
    margin-right: 5px;
  }

  .paragraph {
    margin-bottom: 20px;
  }
}
